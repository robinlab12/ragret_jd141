[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robinlab12-ragret_jd141"
version = "0.1.0"
description = "从输入中抽取数值，计算RAG 检索工程师·混合检索的权重调节相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "robinlab12" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://robinlab12.github.io"
Repository = "https://github.com/robinlab12/ragret_jd141"
Issues = "https://github.com/robinlab12/ragret_jd141/issues"

[project.scripts]
ragret_jd141 = "ragret_jd141:main"

[tool.setuptools]
py-modules = ["ragret_jd141"]
